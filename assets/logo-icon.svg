<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="sehmi-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#18082D" />
    </linearGradient>
    <linearGradient id="sehmi-ribbon-top" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="sehmi-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="sehmi-ribbon-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="70%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="sehmi-spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="45%" stop-color="#C4B5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="sehmi-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F071C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#sehmi-bg-grad)" filter="url(#sehmi-shadow)" />
  <rect width="92" height="92" x="4" y="4" rx="24" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Neural Intelligence Nodes -->
  <circle cx="28" cy="30" r="2.5" fill="#C4B5FD" fill-opacity="0.6" />
  <circle cx="72" cy="70" r="2.5" fill="#C4B5FD" fill-opacity="0.6" />
  <line x1="28" y1="30" x2="38" y2="38" stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="62" y1="62" x2="72" y2="70" stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />

  <!-- Top Curve of 'S' -->
  <path d="M70 27 C62 20, 44 20, 36 27 C28 34, 30 43, 42 47 C48 49, 56 51, 60 54" 
        stroke="url(#sehmi-ribbon-top)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Bottom Curve of 'S' -->
  <path d="M40 46 C34 49, 26 53, 26 62 C26 73, 40 79, 52 79 C64 79, 74 71, 74 62" 
        stroke="url(#sehmi-ribbon-bot)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Dynamic Growth Arrow -->
  <path d="M30 68 L68 28" 
        stroke="url(#sehmi-arrow-grad)" 
        stroke-width="5" 
        stroke-linecap="round" />
  <polygon points="72,24 61,25 71,35" fill="url(#sehmi-arrow-grad)" />

  <!-- Central AI Spark -->
  <circle cx="49" cy="49" r="8" fill="url(#sehmi-spark-glow)" />
  <path d="M49 43 Q49 49 43 49 Q49 49 49 55 Q49 49 55 49 Q49 49 49 43 Z" fill="#FFFFFF" />
  <circle cx="49" cy="49" r="1.8" fill="#7C3AED" />
</svg>